name: SeliaScan
options:
  bundleIdPrefix: com.majkeylab
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.9
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: MTYBUX7QS6
    MARKETING_VERSION: "2.0"
    CURRENT_PROJECT_VERSION: "1"
    VERSIONING_SYSTEM: apple-generic
targets:
  SeliaScan:
    type: application
    platform: iOS
    sources:
      - path: SeliaScan
        excludes:
          - SystemIntegration/ScanControlWidget.swift
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majkeylab.seliascan
        INFOPLIST_FILE: SeliaScan/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SeliaScanControls
    scheme:
      testTargets: [SeliaScanTests, SeliaScanUITests]
  SeliaScanTests:
    type: bundle.unit-test
    platform: iOS
    sources: SeliaScanTests
    dependencies: [target: SeliaScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majkeylab.seliascan.tests
  SeliaScanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeliaScanUITests
      - path: Shared
    dependencies: [target: SeliaScan]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majkeylab.seliascan.uitests
  SeliaScanControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - SeliaScanControls
      - SeliaScan/SystemIntegration/ScanControlWidget.swift
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.majkeylab.seliascan.controls
        INFOPLIST_FILE: SeliaScanControls/Info.plist
        SKIP_INSTALL: YES
